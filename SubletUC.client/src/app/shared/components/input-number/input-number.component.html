<label for="{{forLabel}}" class="block text-sm font-bold text-gray-900 uppercase tracking-wider mb-1">
    {{label}}
</label>

<p-inputNumber 
    [(ngModel)]="value" 
    (onInput)="onInputChange($event.value)"
    [disabled]="disabled"
    [mode]="mode" 
    [placeholder]="placeholder"
    [currency]="currency"
    [suffix]="suffix"
    class="border border-black rounded "
    ></p-inputNumber>

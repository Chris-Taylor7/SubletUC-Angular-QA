<label for="availability" class="block text-sm font-bold text-gray-900 uppercase tracking-wider mb-1">
  Available Until:
</label>

<p-datepicker [(ngModel)]="value" 
  selectionMode="range" 
  (onSelect)="onDateChange($event)"  
  [readonlyInput]="true"   
  [placeholder]="placeholder"
  [showButtonBar]="true" 
  class=" p-datepicker border border-black rounded "
  />

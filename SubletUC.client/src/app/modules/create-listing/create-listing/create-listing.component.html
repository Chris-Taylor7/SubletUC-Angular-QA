<div class="max-w-4xl mx-auto p-8 bg-gray-500 rounded-lg shadow-lg border border-black ">
  <h2 class="text-3xl font-bold text-gray-900 mb-8 pb-2 border-b-2 border-black">Create New Listing</h2>
  
  <!-- Changed from [formGroup] to #form="ngForm" -->
  <form #form="ngForm" (ngSubmit)="onSubmit(listing)" class="space-y-8">
    <!-- Basic Information -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Address -->
      <div class="col-span-2">
        <label class="block text-sm font-bold text-gray-900 uppercase tracking-wider mb-1">
          Address
      </label>
        <input type="text" name="address" pInputText [(ngModel)]="listing.address" class="border border-black rounded " required/>
      </div>

      <!-- Rent and Utilities -->
      <div>
        <app-input-number name="rent" [(ngModel)]="listing.rent" required [placeholder]="'Monthly Rent: '" [mode]="'currency'" [currency]="'USD'" [label]="'Rent: '"></app-input-number>
      </div>
    
      <!-- Average Utilities -->
      <div>
        <app-input-number name="utilities" [(ngModel)]="listing.averageutilities" [placeholder]="'Estimate monthly utilities: '" [mode]="'currency'" [currency]="'USD'" [label]="'Average Utilities: '"></app-input-number>
      </div>
    
      <!-- Bedrooms -->
      <div>
        <app-input-number name="bedrooms" [(ngModel)]="listing.bedrooms" required [placeholder]="'Number of bedrooms: '" [label]="'Bedrooms'"></app-input-number>
      </div>
    
      <!-- Bathrooms -->
      <div>
        <app-input-number name="bathrooms" [(ngModel)]="listing.bathrooms" required [placeholder]="'Number of bathrooms: '" [label]="'Bathrooms'"></app-input-number>
      </div>
    
      <!-- Availability -->
      <div>
        <app-date-picker 
           name="availability" 
           [(ngModel)]="listing.availability" 
           [placeholder]="'Select a Date...'"
           required>
        </app-date-picker>
      </div>
    
      <!-- Distance from Campus -->
      <div>
        <app-input-number name="distanceFromCampus" [(ngModel)]="listing.distanceFromCampus" [label]="'Distance in miles: '" [suffix]="' miles'" [placeholder]="'Distance in miles'"></app-input-number>
      </div>
    </div>

    <!-- Checkbox Options -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-6 border-2 border-black rounded-lg bg-gray-50">
      <!-- Utilities Included -->
      <app-checkbox 
      name="utilitiesIncludedInRent" 
      [(checked)]="listing.utilitiesIncludedInRent"
      label="Utilities Included in Rent"
      forLabel="utilitiesIncluded">
      </app-checkbox>

      <!-- Shared Room -->
      <app-checkbox 
        name="sharedRoom" 
        [(checked)]="listing.sharedRoom"
        (onChange)="onSharedRoomChange()"
        label="Shared Room"
        forLabel="sharedRoom">
      </app-checkbox>

      <!-- Pets Allowed -->
      <app-checkbox 
        name="catsAndDogsAllowed" 
        [(checked)]="listing.catsAndDogsAllowed"
        label="Cats & Dogs Allowed"
        forLabel="petsAllowed">
      </app-checkbox>

      <!-- Washer/Dryer -->
      <app-checkbox 
        name="washerDryer" 
        [(checked)]="listing.washerDryer"
        label="Washer/Dryer"
        forLabel="washerDryer">
      </app-checkbox>

      <!-- Parking -->
      <app-checkbox 
        name="offStreetParking" 
        [(checked)]="listing.offStreetParking"
        label="Off-Street Parking"
        forLabel="parking">
      </app-checkbox>

      <!-- Driveway -->
      <app-checkbox 
        name="driveway" 
        [(checked)]="listing.driveway"
        label="Driveway"
        forLabel="driveway">
      </app-checkbox>
    </div>

    <!-- Shared Roommates (conditional) -->
    <div *ngIf="listing.sharedRoom" class="grid grid-cols-1 md:grid-cols-2 gap-8 p-6 border-2 border-black rounded-lg bg-gray-50">
      <div>
        <app-input-number name="sharedRoommates" [(ngModel)]="listing.sharedRoommates" [label]="'Shared Roomates?'"></app-input-number>
      </div>
    </div>

    <!-- Roommates Section (ngFor instead of FormArray) -->
    <div class="space-y-4 p-6 border-2 border-black rounded-lg bg-gray-50">
      <h3 class="text-lg font-bold text-gray-900 uppercase tracking-wider border-b-2 border-black pb-2">Roommates</h3>
      <div *ngFor="let roommate of listing.roommates; let i = index" class="p-4 border-2 border-black rounded-lg bg-white mt-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <app-input-number [name]="'roommateYear'+i" [(ngModel)]="roommate.year" [label]="'Year: '"></app-input-number>
          </div>
          <div>
            <label [for]="'gender'+i" class="block text-sm font-bold text-gray-900 uppercase tracking-wider">Gender</label>
            <p-select [id]="'gender'+i" [name]="'roommateGender'+i" [(ngModel)]="roommate.Gender" [options]="genderOptions"
                      optionLabel="label" optionValue="value"></p-select>
          </div>
        </div>
        <button type="button" pButton icon="pi pi-trash" class="p-button-rounded p-button-danger mt-4 bg-red-700 hover:bg-red-800 border-2 border-black"
                (click)="removeRoommate(i)">
          Remove Roommate
        </button>
      </div>
      <button type="button" pButton icon="pi pi-plus" class="p-button-rounded mt-4 bg-gray-900 hover:bg-gray-800 text-white border-2 border-black"
              (click)="addRoommate()">
        Add Roommate
      </button>
    </div>

    <!-- Description and Notes -->
    <div class="space-y-6">
      <div>
        <label for="description" class="block text-sm font-bold text-gray-900 uppercase tracking-wider">Description</label>
        <textarea pInputTextarea id="description" name="description" [(ngModel)]="listing.description" rows="4" 
                  class="w-full mt-2 border-2 border-black rounded-lg p-3 focus:ring-2 focus:ring-red-600 focus:border-transparent bg-gray-50"></textarea>
      </div>
    </div>

    <!-- Photo Upload -->
    <div class="p-6 border-2 border-black rounded-lg bg-gray-50">
      <label class="block text-sm font-bold text-gray-900 uppercase tracking-wider mb-2">Photo</label>
      <p-fileUpload name="photo" [customUpload]="true" (uploadHandler)="onPhotoUpload($event)"
                    accept="image/*" maxFileSize="1000000" chooseLabel="Select Photo"
                    class="mt-1 [&>.p-fileupload]:w-full [&>.p-fileupload-buttonbar]:border-black [&>.p-fileupload-content]:border-2 [&>.p-fileupload-content]:border-black">
      </p-fileUpload>
    </div>

    <!-- Submit Button -->
    <div class="flex justify-end pt-4 border-t-2 border-black">
      <p-button type="submit" label="Submit Listing" 
                class="bg-red-700 hover:bg-red-800 text-white font-bold py-3 px-6 rounded-lg border-2 border-black shadow-lg transition duration-300 transform hover:scale-105"></p-button>
    </div>
  </form>
</div>
